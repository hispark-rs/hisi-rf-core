name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
          components: clippy,rust-src,rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.52.0
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo check -Zbuild-std=core --locked --target riscv32imfc-unknown-none-elf --all-features
      - name: Check public API snapshot
        run: .github/scripts/check-public-api.sh
      - run: cargo package --locked --no-verify
